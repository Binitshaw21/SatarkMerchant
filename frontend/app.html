<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatarkMerchant // Scanner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Courier New', Courier, monospace; }
        .terminal { background: #020617; border: 1px solid #1e293b; height: 250px; overflow-y: auto; font-size: 0.85rem; }
        .log-time { color: #64748b; } .log-info { color: #38bdf8; } .log-crit { color: #ef4444; font-weight: bold; } .log-success { color: #10b981; font-weight: bold; }
        .status-idle { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .status-secure { border-color: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); background-color: rgba(16, 185, 129, 0.1); }
        .status-fraud { border-color: #ef4444; box-shadow: 0 0 25px rgba(239, 68, 68, 0.8); background-color: rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <!-- SCREEN 1: AUTHENTICATION -->
    <div id="auth-screen" class="w-full max-w-md bg-slate-800 rounded-lg p-8 shadow-lg border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-white">SATARK<span class="text-sky-500">MERCHANT</span></h1>
        
        <!-- Login Form (VISIBLE BY DEFAULT) -->
        <div id="login-form">
            <h2 class="text-sm text-slate-400 mb-4">SYSTEM LOGIN</h2>
            <input id="log-id" type="text" placeholder="Merchant ID, Email, or Phone" class="w-full mb-3 p-2 rounded bg-slate-900 border border-slate-600 text-white">
            <input id="log-pass" type="password" placeholder="Password" class="w-full mb-4 p-2 rounded bg-slate-900 border border-slate-600 text-white">
            <button onclick="loginMerchant()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2 rounded">ACCESS DASHBOARD</button>
            <p class="text-center text-xs mt-4 text-sky-400 cursor-pointer" onclick="toggleAuth()">Need an account? Register here.</p>
        </div>

        <!-- Registration Form (HIDDEN BY DEFAULT) -->
        <div id="register-form" class="hidden">
            <h2 class="text-sm text-slate-400 mb-4">ONBOARD NEW BUSINESS</h2>
            <input id="reg-name" type="text" placeholder="Business Name" class="w-full mb-3 p-2 rounded bg-slate-900 border border-slate-600 text-white">
            <input id="reg-vpa" type="text" placeholder="Your Real UPI ID (e.g. name@bank)" class="w-full mb-3 p-2 rounded bg-slate-900 border border-slate-600 text-white">
            <input id="reg-contact" type="text" placeholder="Email OR Phone (+91...)" class="w-full mb-3 p-2 rounded bg-slate-900 border border-slate-600 text-white">
            <input id="reg-pass" type="password" placeholder="Create Password" class="w-full mb-4 p-2 rounded bg-slate-900 border border-slate-600 text-white">
            <button onclick="registerMerchant()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2 rounded">REGISTER SYSTEM</button>
            <p class="text-center text-xs mt-4 text-sky-400 cursor-pointer" onclick="toggleAuth()">Already registered? Login here.</p>
        </div>
        
        <p id="auth-msg" class="text-center text-red-500 text-xs mt-4"></p>
    </div>

    <!-- SCREEN 2: SCANNER DASHBOARD (Hidden initially) -->
    <div id="app-screen" class="hidden w-full max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-wider text-white">SATARK<span class="text-sky-500">MERCHANT</span></h1>
                <p id="display-name" class="text-slate-400 text-sm">Business Name</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-slate-500">MERCHANT ID: <span id="display-id" class="text-white font-bold">M-XXX</span></p>
                <p class="text-xs text-sky-400 cursor-pointer" onclick="logout()">LOGOUT</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="flex flex-col gap-4">
                <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold">Optical Sensor</h2>
                        <button id="start-btn" onclick="startScanner()" class="px-4 py-1 bg-sky-600 text-white rounded text-sm font-bold">ACTIVATE</button>
                    </div>
                    <div id="reader-container" class="relative status-idle border-2 transition-all p-2 rounded">
                        <div id="reader" style="width: 100%; min-height: 300px;"></div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-4">
                <div id="status-board" class="bg-slate-800 rounded-lg p-6 text-center border border-slate-700 transition-all">
                    <h3 id="status-text" class="text-3xl font-bold text-sky-400">SYSTEM IDLE</h3>
                    <p id="status-subtext" class="text-slate-400 mt-2">Ready to audit transaction.</p>
                </div>
                <div class="bg-slate-800 rounded-lg p-4 border border-slate-700 flex-grow">
                    <h2 class="text-sm font-semibold mb-2 flex items-center">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse mr-2"></span> AWS Telemetry
                    </h2>
                    <div id="terminal" class="terminal rounded p-3 font-mono"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // YOUR EXACT API URLs
        const AUTH_API = 'https://fnpbwmma4a.execute-api.ap-south-1.amazonaws.com/dev/auth'; 
        const SCAN_API = 'https://fnpbwmma4a.execute-api.ap-south-1.amazonaws.com/dev/scan'; 
        
        let html5QrCode;
        let currentMerchantId = '';

        // UI Toggles
        function toggleAuth() {
            document.getElementById('register-form').classList.toggle('hidden');
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('auth-msg').innerText = '';
        }

        function showApp(merchantId, businessName) {
            currentMerchantId = merchantId;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('display-id').innerText = merchantId;
            document.getElementById('display-name').innerText = businessName;
            logToTerminal(`System logged in as ${merchantId}`);
        }

        function logout() {
            if(html5QrCode) html5QrCode.stop().catch(e=>console.log(e));
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
            
            // Clear inputs on logout
            document.getElementById('log-id').value = '';
            document.getElementById('log-pass').value = '';
        }

        // AUTHENTICATION LOGIC
        async function registerMerchant() {
            const btn = event.target; btn.innerText = "REGISTERING...";
            try {
                const res = await fetch(AUTH_API, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'register',
                        business_name: document.getElementById('reg-name').value,
                        registered_vpa: document.getElementById('reg-vpa').value,
                        contact_info: document.getElementById('reg-contact').value,
                        password: document.getElementById('reg-pass').value
                    })
                });
                const data = await res.json();
                if (data.merchant_id) {
                    alert(`Success! Your Merchant ID is: ${data.merchant_id}. We have also sent it to your email/phone. You can now log in.`);
                    toggleAuth();
                } else {
                    document.getElementById('auth-msg').innerText = "Registration failed. Check API.";
                }
            } catch (e) {
                document.getElementById('auth-msg').innerText = "Network error.";
            }
            btn.innerText = "REGISTER SYSTEM";
        }

        async function loginMerchant() {
            const btn = event.target; btn.innerText = "AUTHENTICATING...";
            try {
                const res = await fetch(AUTH_API, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'login',
                        merchant_id: document.getElementById('log-id').value,
                        password: document.getElementById('log-pass').value
                    })
                });
                if(res.status === 200) {
                    const data = await res.json();
                    showApp(data.merchant_id, data.business_name);
                } else {
                    document.getElementById('auth-msg').innerText = "Invalid Credentials.";
                }
            } catch (e) {
                document.getElementById('auth-msg').innerText = "Network error.";
            }
            btn.innerText = "ACCESS DASHBOARD";
        }

        // SCANNER LOGIC 
        async function onScanSuccess(decodedText) {
            html5QrCode.stop();
            document.getElementById('start-btn').innerText = 'RESET';
            updateStatus('processing', 'ANALYZING...', 'Querying DynamoDB');
            
            try {
                const response = await fetch(SCAN_API, {
                    method: 'POST',
                    body: JSON.stringify({
                        merchant_id: currentMerchantId,
                        qr_payload: decodedText
                    })
                });
                const result = await response.json();
                
                if (result.isValid) {
                    logToTerminal(`Match! DB: ${result.registered_vpa} | Scan: ${result.scanned_vpa}`, 'success');
                    updateStatus('secure', 'SECURE', 'VPA matches database.');
                } else {
                    logToTerminal(`FRAUD! DB: ${result.registered_vpa} | Scan: ${result.scanned_vpa}`, 'crit');
                    updateStatus('fraud', 'FRAUD DETECTED', 'DO NOT ACCEPT PAYMENT.');
                }
            } catch (error) {
                logToTerminal(`AWS Error: ${error}`, 'crit');
            }
        }

        function startScanner() {
            if(document.getElementById('start-btn').innerText === 'RESET') {
                updateStatus('idle', 'SYSTEM IDLE', 'Ready.');
                document.getElementById('start-btn').innerText = 'ACTIVATE';
                return;
            }
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess).catch(e => logToTerminal("Camera error."));
            document.getElementById('start-btn').innerText = 'SCANNING';
        }

        function updateStatus(state, main, sub) {
            document.getElementById('status-text').innerText = main;
            document.getElementById('status-subtext').innerText = sub;
            const b = document.getElementById('status-board');
            b.className = "bg-slate-800 rounded-lg p-6 text-center border border-slate-700 transition-all " + 
                (state==='secure' ? 'status-secure' : state==='fraud' ? 'status-fraud' : '');
        }
        function logToTerminal(msg, level='info') {
            document.getElementById('terminal').innerHTML += `<div><span class="log-time">[SYS]</span> <span class="log-${level}">${msg}</span></div>`;
            document.getElementById('terminal').scrollTop = document.getElementById('terminal').scrollHeight;
        }
    </script>
</body>
</html>
