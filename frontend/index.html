<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatarkMerchant // Enterprise Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap');

        body { 
            background: linear-gradient(135deg, #020617, #0f172a, #1e1b4b); 
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #e2e8f0; 
            font-family: 'Rajdhani', sans-serif; 
            min-height: 100vh;
            overflow-x: hidden;
            perspective: 1000px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1, h2, h3, .terminal { font-family: 'Orbitron', sans-serif; }

        /* Glassmorphism Cards */
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            transform-style: preserve-3d;
        }

        .glass-card:hover {
            transform: translateY(-5px) rotateX(2deg) rotateY(2deg);
            box-shadow: 0 15px 40px 0 rgba(56, 189, 248, 0.2);
        }

        /* 3D Button */
        .btn-3d {
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-3d::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
            z-index: -1;
        }
        .btn-3d:hover::before {
            left: 100%;
        }
        .btn-3d:active {
            transform: scale(0.95) translateY(2px);
        }

        /* Animated Gradient Text */
        .text-gradient {
            background: linear-gradient(to right, #38bdf8, #818cf8, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: textShine 3s linear infinite;
        }

        @keyframes textShine {
            to { background-position: 200% center; }
        }

        /* Inputs */
        input {
            transition: all 0.3s ease;
            background: rgba(2, 6, 23, 0.7) !important;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transform: scale(1.02);
        }

        /* Terminal */
        .terminal { 
            background: rgba(2, 6, 23, 0.85); 
            border: 1px solid #1e293b; 
            height: 250px; 
            overflow-y: auto; 
            font-size: 0.85rem; 
            position: relative;
            text-shadow: 0 0 5px rgba(56,189,248,0.5);
        }
        .terminal::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .log-time { color: #64748b; } 
        .log-info { color: #38bdf8; } 
        .log-crit { color: #ef4444; font-weight: bold; text-shadow: 0 0 8px red;} 
        .log-success { color: #10b981; font-weight: bold; text-shadow: 0 0 8px #10b981;}
        
        /* Scanner Overlay */
        #reader-container {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }
        .scan-line {
            width: 100%; height: 3px; 
            background: #38bdf8;
            position: absolute; top: 0; left: 0; z-index: 10;
            box-shadow: 0 0 20px 2px #38bdf8, 0 0 40px 5px #818cf8;
            animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
            display: none; 
        }
        @keyframes scan { 0% { top: 0%; opacity: 0.8; } 100% { top: 98%; opacity: 1; } }

        /* Dynamic Status States */
        .status-idle { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        .status-secure { border-color: #10b981; box-shadow: inset 0 0 30px rgba(16, 185, 129, 0.2), 0 0 30px rgba(16, 185, 129, 0.5); background-color: rgba(16, 185, 129, 0.05); }
        .status-fraud { border-color: #ef4444; box-shadow: inset 0 0 30px rgba(239, 68, 68, 0.2), 0 0 30px rgba(239, 68, 68, 0.5); background-color: rgba(239, 68, 68, 0.05); animation: pulse-red 1s infinite; }
        
        @keyframes pulse-red {
            0% { box-shadow: inset 0 0 30px rgba(239, 68, 68, 0.2), 0 0 30px rgba(239, 68, 68, 0.5); }
            50% { box-shadow: inset 0 0 50px rgba(239, 68, 68, 0.5), 0 0 60px rgba(239, 68, 68, 0.8); }
            100% { box-shadow: inset 0 0 30px rgba(239, 68, 68, 0.2), 0 0 30px rgba(239, 68, 68, 0.5); }
        }
        
        /* 3D Appearing Animation */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(40px) rotateX(-15deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotateX(0deg); }
        }
        .animate-pop-in {
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform-origin: center bottom;
        }

        /* Particle floating animation in background (optional pure CSS) */
        .particles {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; pointer-events: none;
        }
        .particle {
            position: absolute; border-radius: 50%; background: rgba(56, 189, 248, 0.5);
            animation: float 20s infinite linear;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }
        @keyframes float {
            0% { transform: translateY(100vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) translateX(100px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <!-- CSS Particles -->
    <div class="particles" id="particles"></div>

    <!-- SCREEN 1: AUTHENTICATION -->
    <div id="auth-screen" class="w-full max-w-md glass-card rounded-2xl p-8 animate-pop-in">
        <h1 class="text-3xl font-bold text-center mb-6"><span class="text-gradient">SATARK MERCHANT</span></h1>
        
        <!-- Registration Form -->
        <div id="register-form">
            <h2 class="text-sm text-sky-300 mb-4 tracking-wider">ONBOARD NEW BUSINESS</h2>
            <input id="reg-name" type="text" placeholder="Business Name" class="w-full mb-3 p-3 rounded-lg border border-slate-600 text-white placeholder-slate-400">
            <input id="reg-vpa" type="text" placeholder="Your Real UPI ID (e.g. name@bank)" class="w-full mb-3 p-3 rounded-lg border border-slate-600 text-white placeholder-slate-400">
            <input id="reg-pass" type="password" placeholder="Create Password" class="w-full mb-5 p-3 rounded-lg border border-slate-600 text-white placeholder-slate-400">
            <button onclick="registerMerchant()" class="w-full btn-3d bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-lg shadow-[0_0_15px_rgba(56,189,248,0.5)]">REGISTER SYSTEM</button>
            <p class="text-center text-xs mt-5 text-sky-400 cursor-pointer hover:text-white transition" onclick="toggleAuth()">Already registered? Login here.</p>
        </div>

        <!-- Login Form (Hidden by default) -->
        <div id="login-form" class="hidden">
            <h2 class="text-sm text-sky-300 mb-4 tracking-wider">SYSTEM LOGIN</h2>
            <input id="log-id" type="text" placeholder="Merchant ID (e.g. M-1A2B)" class="w-full mb-3 p-3 rounded-lg border border-slate-600 text-white placeholder-slate-400">
            <input id="log-pass" type="password" placeholder="Password" class="w-full mb-5 p-3 rounded-lg border border-slate-600 text-white placeholder-slate-400">
            <button onclick="loginMerchant()" class="w-full btn-3d bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow-[0_0_15px_rgba(16,185,129,0.5)]">ACCESS DASHBOARD</button>
            <p class="text-center text-xs mt-5 text-sky-400 cursor-pointer hover:text-white transition" onclick="toggleAuth()">Need an account? Register here.</p>
        </div>
        <p id="auth-msg" class="text-center text-red-400 font-bold text-xs mt-4"></p>
    </div>

    <!-- SCREEN 2: SCANNER DASHBOARD (Hidden initially) -->
    <div id="app-screen" class="hidden w-full max-w-6xl mx-auto animate-pop-in">
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-white/10">
            <div>
                <h1 class="text-3xl font-bold tracking-wider"><span class="text-gradient">SATARK MERCHANT</span></h1>
                <p id="display-name" class="text-sky-300 text-sm tracking-widest mt-1">Business Name</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-slate-400 tracking-widest">MERCHANT ID: <span id="display-id" class="text-white font-bold text-lg">M-XXX</span></p>
                <p class="text-xs text-rose-400 cursor-pointer hover:text-rose-300 mt-2 font-bold tracking-wider transition" onclick="logout()">[ TERMINATE SESSION ]</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="flex flex-col gap-4">
                <div class="glass-card rounded-2xl p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-sky-100 tracking-wider">OPTICAL SENSOR</h2>
                        <button id="start-btn" onclick="startScanner()" class="px-5 py-2 btn-3d bg-sky-600 shadow-[0_0_15px_rgba(56,189,248,0.5)] text-white rounded-lg text-sm font-bold">ACTIVATE</button>
                    </div>
                    <div id="reader-container" class="relative status-idle border border-white/20 transition-all p-2 bg-slate-900/50">
                        <div id="scan-line" class="scan-line"></div>
                        <div id="reader" style="width: 100%; min-height: 300px;"></div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-4">
                <div id="status-board" class="glass-card rounded-2xl p-8 text-center transition-all">
                    <h3 id="status-text" class="text-4xl font-bold text-sky-400 tracking-widest uppercase" style="text-shadow: 0 0 15px currentColor;">SYSTEM IDLE</h3>
                    <p id="status-subtext" class="text-sky-200 mt-4 tracking-wider text-lg">Ready to audit transaction.</p>
                </div>
                <div class="glass-card rounded-2xl p-6 flex-grow">
                    <h2 class="text-sm font-bold mb-3 flex items-center text-sky-200 tracking-widest">
                        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse mr-3 shadow-[0_0_10px_rgba(16,185,129,1)]"></span> AWS TELEMETRY STREAM
                    </h2>
                    <div id="terminal" class="terminal rounded-lg p-4 font-mono"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create random particles
        const particlesContainer = document.getElementById('particles');
        for(let i=0; i<20; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            let size = Math.random() * 5 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 15 + 10) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            particlesContainer.appendChild(p);
        }

        // --- PASTE YOUR 2 API URLS HERE ---
        const AUTH_API = 'https://fnpbwmma4a.execute-api.ap-south-1.amazonaws.com/dev/auth'; 
        const SCAN_API = 'https://fnpbwmma4a.execute-api.ap-south-1.amazonaws.com/dev/scan'; 
        
        let html5QrCode;
        let currentMerchantId = '';

        // UI Toggles
        function toggleAuth() {
            document.getElementById('register-form').classList.toggle('hidden');
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('auth-msg').innerText = '';
        }

        function showApp(merchantId, businessName) {
            currentMerchantId = merchantId;
            document.getElementById('auth-screen').classList.add('hidden');
            // Re-trigger animation
            const appScreen = document.getElementById('app-screen');
            appScreen.classList.remove('hidden');
            appScreen.classList.remove('animate-pop-in');
            void appScreen.offsetWidth; // trigger reflow
            appScreen.classList.add('animate-pop-in');
            
            document.getElementById('display-id').innerText = merchantId;
            document.getElementById('display-name').innerText = businessName;
            logToTerminal(`System authenticated securely as ${merchantId}`);
        }

        function logout() {
            if(html5QrCode) html5QrCode.stop().catch(e=>console.log(e));
            document.getElementById('app-screen').classList.add('hidden');
            
            const authScreen = document.getElementById('auth-screen');
            authScreen.classList.remove('hidden');
            authScreen.classList.remove('animate-pop-in');
            void authScreen.offsetWidth;
            authScreen.classList.add('animate-pop-in');
            
            document.getElementById('start-btn').innerText = 'ACTIVATE';
            document.getElementById('scan-line').style.display = 'none';
        }

        // AUTHENTICATION LOGIC
        async function registerMerchant() {
            const btn = event.target; btn.innerText = "REGISTERING...";
            try {
                const res = await fetch(AUTH_API, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'register',
                        business_name: document.getElementById('reg-name').value,
                        registered_vpa: document.getElementById('reg-vpa').value,
                        password: document.getElementById('reg-pass').value
                    })
                });
                const data = await res.json();

                if (data.merchant_id) {
                    alert(`Success! Your Merchant ID is: ${data.merchant_id}. Please write this down to login.`);
                    toggleAuth();
                } else {
                    alert(`AWS Backend Error: ${JSON.stringify(data)}`);
                }
            } catch (e) {
                document.getElementById('auth-msg').innerText = "Registration failed. Check API.";
            }
            btn.innerText = "REGISTER SYSTEM";
        }

        async function loginMerchant() {
            const btn = event.target; btn.innerText = "AUTHENTICATING...";
            try {
                const res = await fetch(AUTH_API, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'login',
                        merchant_id: document.getElementById('log-id').value.toUpperCase(),
                        password: document.getElementById('log-pass').value
                    })
                });
                if(res.status === 200) {
                    const data = await res.json();
                    showApp(data.merchant_id, data.business_name);
                } else {
                    document.getElementById('auth-msg').innerText = "Invalid ID or Password.";
                }
            } catch (e) {
                document.getElementById('auth-msg').innerText = "Network error.";
            }
            btn.innerText = "ACCESS DASHBOARD";
        }

        // SCANNER LOGIC
        async function onScanSuccess(decodedText) {
            html5QrCode.stop();
            document.getElementById('scan-line').style.display = 'none';
            document.getElementById('start-btn').innerText = 'RESET';
            updateStatus('processing', 'ANALYZING...', 'Querying AWS DynamoDB via API Gateway');
            
            try {
                const response = await fetch(SCAN_API, {
                    method: 'POST',
                    body: JSON.stringify({
                        merchant_id: currentMerchantId,
                        qr_payload: decodedText
                    })
                });
                const result = await response.json();
                
                if (result.isValid) {
                    logToTerminal(`Match! DB: ${result.registered_vpa} | Scan: ${result.scanned_vpa}`, 'success');
                    updateStatus('secure', 'SECURE', 'VPA MATCHES DATABASE. SAFE TO PROCEED.');
                } else {
                    logToTerminal(`FRAUD! DB: ${result.registered_vpa} | Scan: ${result.scanned_vpa}`, 'crit');
                    updateStatus('fraud', 'FRAUD DETECTED', 'CRITICAL ANOMALY: DO NOT ACCEPT PAYMENT.');
                }
            } catch (error) {
                logToTerminal(`AWS Error: ${error}`, 'crit');
            }
        }

        function startScanner() {
            if(document.getElementById('start-btn').innerText === 'RESET') {
                updateStatus('idle', 'SYSTEM IDLE', 'Ready to audit transaction.');
                document.getElementById('start-btn').innerText = 'ACTIVATE';
                return;
            }
            html5QrCode = new Html5Qrcode("reader");
            document.getElementById('scan-line').style.display = 'block';
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, onScanSuccess).catch(e => logToTerminal("Camera error."));
            document.getElementById('start-btn').innerText = 'SCANNING';
        }

        function updateStatus(state, main, sub) {
            const textEl = document.getElementById('status-text');
            const subEl = document.getElementById('status-subtext');
            const boardEl = document.getElementById('status-board');
            
            textEl.innerText = main;
            subEl.innerText = sub;
            
            // Apply text colors based on state
            if(state === 'secure') {
                textEl.className = 'text-4xl font-bold tracking-widest uppercase text-emerald-400';
                subEl.className = 'text-emerald-200 mt-4 tracking-wider text-lg font-bold';
            } else if(state === 'fraud') {
                textEl.className = 'text-4xl font-bold tracking-widest uppercase text-rose-500';
                subEl.className = 'text-rose-200 mt-4 tracking-wider text-lg font-bold';
            } else if(state === 'processing') {
                textEl.className = 'text-4xl font-bold tracking-widest uppercase text-yellow-400 animate-pulse';
                subEl.className = 'text-yellow-200 mt-4 tracking-wider text-lg';
            } else {
                textEl.className = 'text-4xl font-bold tracking-widest uppercase text-sky-400';
                subEl.className = 'text-sky-200 mt-4 tracking-wider text-lg';
            }
            
            boardEl.className = "glass-card rounded-2xl p-8 text-center transition-all duration-500 " + 
                (state==='secure' ? 'status-secure' : state==='fraud' ? 'status-fraud' : '');
        }
        
        function logToTerminal(msg, level='info') {
            const term = document.getElementById('terminal');
            term.innerHTML += `<div class="mb-1 animate-pop-in" style="animation-duration: 0.3s;"><span class="log-time">[SYS]</span> <span class="log-${level}">${msg}</span></div>`;
            term.scrollTop = term.scrollHeight;
        }
    </script>
</body>
</html>
